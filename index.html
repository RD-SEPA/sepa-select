<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEPA - Prototipo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .caja {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }
    h1 {
      color: #1D3A21;
      margin-bottom: 8px;
      font-size: 24px;
    }
    p.subtitulo {
      color: #888;
      font-size: 13px;
      margin-bottom: 28px;
    }
    label {
      display: block;
      text-align: left;
      font-size: 14px;
      color: #444;
      margin-bottom: 4px;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    button {
      background: #1D3A21;
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }
    button:hover {
      background: #2D5A30;
    }
    .resultado {
      margin-top: 24px;
      font-size: 28px;
      font-weight: bold;
      color: #1D3A21;
      min-height: 40px;
    }
    .etiqueta-resultado {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>SEPA-Select</h1>
    <p class="subtitulo">Prototipo de verificación · programa-sepa.com.ar</p>

    <label>Valor X</label>
    <input type="number" id="x" placeholder="0">

    <label>Valor Y</label>
    <input type="number" id="y" placeholder="0">

    <button onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado"></div>
    <div class="etiqueta-resultado" id="etiqueta"></div>
  </div>

  <script>
    function calcular() {
      const x = parseFloat(document.getElementById('x').value);
      const y = parseFloat(document.getElementById('y').value);
      if (isNaN(x) || isNaN(y)) {
        document.getElementById('resultado').textContent = '—';
        document.getElementById('etiqueta').textContent = 'Ingresá dos números';
        return;
      }
      const z = x + y;
      document.getElementById('resultado').textContent = z;
      document.getElementById('etiqueta').textContent = `Z = ${x} + ${y}`;
    }
  </script>
</body>
</html>
